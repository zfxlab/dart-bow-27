site_name: PnX Documentation
site_dir: build/docs
repo_url: https://github.com/HKUSTGZ-ROBOMASTER-PNX/pnx_template
edit_uri: edit/main/docs/

theme:
  name: material

  # 顶层使用 Tab，左侧只显示当前分类
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.indexes
    - content.action.edit

    - toc.follow

    - content.code.copy
    - content.code.annotate

    - search.suggest
    - search.highlight

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式


markdown_extensions:

  # Note / Warning / Tip 等提示块
  - admonition
  - pymdownx.details

  # 代码高亮
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  # Tab
  - pymdownx.tabbed:
      alternate_style: true

  # Mermaid + 更完整的 fenced code block
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


nav:

  - 首页: index.md

  - 开始使用:
      - 项目结构: project-structure.md
      - 配置: configuration.md
      - 配置参考: configuration-reference.md
      - 创建线程: thread.md
      - 启动流程: startup.md

  - 理解 PnX:
      - 通用回调: concepts/interrupt-callback.md

  - API Reference:
      - 总览: api/index.md

      - BSP:
          - CAN: api/bsp-can.md
          - ADC: api/bsp-adc.md
          - DMA 缓冲区: api/bsp-dma.md
          - DWT 时间: api/bsp-dwt.md
          - EXTI 外部中断: api/bsp-exti.md
          - Flash: api/bsp-flash.md
          - GPIO: api/bsp-gpio.md
          - PWM: api/bsp-pwm.md
          - SPI: api/bsp-spi.md
          - USART: api/bsp-usart.md
          - USB CDC: api/bsp-usb.md

      - PnX Modules:
          - AHRS: api/ahrs.md
          - Referee: api/referee.md
          - Remoter:
              - Overview: api/remoter.md
              - PS2 Controller: api/ps2.md

      - Devices:
          - Motors: api/motors.md

      - Libs:
          - PnX Libs: api/libs.md

  - 维护资料:
      - 给 Agent 的项目资料: agent-context.md


extra_css:
  - stylesheets/extra.css
